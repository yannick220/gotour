const term=input.value.trim().toLocaleLowerCase("fr");
const started=selectedFormats.size>0||selectedPays.size>0||onlyNow||term.length>0;
const found=started?profiles.filter(p=>!declined.includes(p.name)&&!requested.includes(p.name)&&(!selectedFormats.size||p.formats.some(f=>selectedFormats.has(f)))&&(!selectedPays.size||selectedPays.has(p.pay))&&(!onlyNow||p.now)&&(!term||[p.name,p.theme,p.quote,p.bio,...p.formats,p.pay].join(" ").toLocaleLowerCase("fr").includes(term))):[];
document.getElementById("matchCount").textContent=started?found.length:"";
document.getElementById("results").innerHTML=found.length?found.map(p=>'<button class="result" data-person="'+p.name+'"><img src="https://randomuser.me/api/portraits/'+p.gender+'/'+p.pic+'.jpg" alt=""><span><strong>'+p.name+'</strong><small>'+p.theme+' · '+p.formats.join(", ")+'</small></span><b>›</b></button>').join(''):(started?'<p class="muted">Aucun profil ne correspond à ces critères.</p>':'');
document.querySelectorAll("[data-person]").forEach(b=>b.onclick=()=>{let name=b.dataset.person;filter="Tous";searchTerm="";idx=pool().findIndex(p=>p.name===name);sheet.classList.remove("open");render()})
}
input.oninput=refresh;
panel.querySelectorAll("[data-format]").forEach(b=>b.onclick=()=>{const v=b.dataset.format;selectedFormats.has(v)?selectedFormats.delete(v):selectedFormats.add(v);b.classList.toggle("active",selectedFormats.has(v));refresh()});
panel.querySelectorAll("[data-pay]").forEach(b=>b.onclick=()=>{const v=b.dataset.pay;selectedPays.has(v)?selectedPays.delete(v):selectedPays.add(v);b.classList.toggle("active",selectedPays.has(v));refresh()});
document.getElementById("nowOnly").onclick=e=>{onlyNow=!onlyNow;e.currentTarget.classList.toggle("active",onlyNow);refresh()};
refresh()
}
function toast(t){let n=document.getElementById("notice");n.textContent=t;n.classList.add("show");setTimeout(()=>n.classList.remove("show"),2200)}

function aboutGuidz(){let cover=document.getElementById("guidzInfo");if(cover){cover.remove();return}cover=document.createElement("div");cover.id="guidzInfo";cover.className="guidz-info-cover";cover.innerHTML='<div class="guidz-info-box" role="dialog" aria-label="Les expériences GUIDZ"><strong>Trois façons de découvrir</strong><p><b>Anecdote</b><span>5 à 15 min · Un échange ou un conseil ponctuel.</span></p><p><b>Balade</b><span>30 à 60 min · Une découverte accompagnée.</span></p><p><b>Immersion</b><span>1 à 3 h · Une expérience approfondie.</span></p></div>';document.querySelector(".app").appendChild(cover);cover.addEventListener("click",e=>{if(e.target===cover)cover.remove()})}document.getElementById("aboutAlca").onclick=aboutGuidz;
function updateCounts(){const a=document.getElementById("archiveCount"),b=document.getElementById("applicationsCount");if(a.textContent!==String(declined.length)){a.textContent=declined.length;a.classList.remove("pop");void a.offsetWidth;a.classList.add("pop")}if(b.textContent!==String(requested.length)){b.textContent=requested.length;b.classList.remove("pop");void b.offsetWidth;b.classList.add("pop")}}
function decide(kind){if(animating||!active.length)return;animating=true;const p=active[idx],accepted=kind==="request",cue=document.getElementById(accepted?"saveCue":"dismissCue");cue.classList.add("visible");card.style.transition="transform .32s ease,opacity .3s";card.style.transform="translateY("+(accepted?540:-540)+"px)";card.style.opacity="0";setTimeout(()=>{(accepted?requested:declined).push(p.name);idx=0;updateCounts();render();cue.classList.remove("visible");animating=false;toast(accepted?"Demande envoyée":"Pas intéressé")},340)}
function listing(kind){let arr=kind==="requested"?requested:declined;show('<h2>'+(kind==="requested"?"Demandes envoyées":"Pas intéressé")+'</h2><p class="muted">'+arr.length+' profil(s)</p>'+(arr.length?arr.map(name=>{let p=profiles.find(x=>x.name===name);return '<div class="listrow"><img src="https://randomuser.me/api/portraits/'+p.gender+'/'+p.pic+'.jpg"><div><strong>'+p.name+'</strong><small>'+p.formats.join(' · ')+'</small></div><button data-restore="'+p.name+'">↩</button></div>'}).join(''):'<p>Aucun profil pour le moment.</p>'));panel.querySelectorAll("[data-restore]").forEach(b=>b.onclick=()=>{let a=kind==="requested"?requested:declined;a.splice(a.indexOf(b.dataset.restore),1);updateCounts();render();listing(kind)})}
document.getElementById("archiveBtn").onclick=()=>listing("declined");
document.getElementById("applicationsDock").onclick=()=>listing("requested");
document.getElementById("filterBtn").onclick=filters;
sheet.onclick=e=>{if(e.target===sheet)sheet.classList.remove("open")};
let suppressCardClick=false;card.onclick=e=>{if(suppressCardClick){e.preventDefault();e.stopPropagation();suppressCardClick=false;return}if(!drag&&!animating&&active.length)profile()};
card.addEventListener("pointerdown",e=>{if(animating)return;drag={x:e.clientX,y:e.clientY,dx:0,dy:0};card.setPointerCapture(e.pointerId)});
card.addEventListener("pointermove",e=>{if(!drag)return;drag.dx=e.clientX-drag.x;drag.dy=e.clientY-drag.y;if(Math.hypot(drag.dx,drag.dy)>7){card.style.transition="none";card.style.transform='translate('+drag.dx+'px,'+drag.dy+'px) rotate('+(drag.dx/25)+'deg)';document.getElementById("saveCue").classList.toggle("visible",drag.dy>85&&Math.abs(drag.dy)>Math.abs(drag.dx));document.getElementById("dismissCue").classList.toggle("visible",drag.dy< -85&&Math.abs(drag.dy)>Math.abs(drag.dx))}});
card.addEventListener("pointerup",()=>{if(!drag)return;let {dx,dy}=drag;if(Math.hypot(dx,dy)>12){suppressCardClick=true;setTimeout(()=>{suppressCardClick=false},350)}drag=null;document.getElementById("saveCue").classList.remove("visible");document.getElementById("dismissCue").classList.remove("visible");if(Math.abs(dy)>90&&Math.abs(dy)>Math.abs(dx))decide(dy>0?"request":"decline");else if(Math.abs(dx)>65)move(dx<0?1:-1);else{card.style.transition="transform .3s";card.style.transform=""}});
card.addEventListener("pointercancel",()=>{drag=null;card.style.transform=""});
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")move(1);if(e.key==="ArrowLeft")move(-1);if(e.key==="ArrowDown")decide("request");if(e.key==="ArrowUp")decide("decline");if(e.key==="Escape")sheet.classList.remove("open")});render();updateCounts();
</script></body></html>
