<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7f5"><title>ALCA — La ville par ceux qui la vivent</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>
:root{--ink:#111;--muted:#7d7d7d;--red:#d52a36;--paper:#f7f7f5}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:#e9e9e7;font-family:Montserrat,Arial,sans-serif;color:var(--ink)}button{font:inherit;cursor:pointer}.app{position:relative;max-width:430px;height:100dvh;min-height:550px;margin:auto;overflow:hidden;background:var(--paper);box-shadow:0 0 70px #0001}.top{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 27px) 25px 0;z-index:20;display:flex;align-items:center;justify-content:space-between}.logo{font-size:36px;font-weight:900;letter-spacing:-2.5px}.logo span{color:var(--red)}.top button{width:44px;height:44px;border:1px solid #dededc;border-radius:50%;background:white;font-size:19px}.sub{position:absolute;top:calc(env(safe-area-inset-top) + 91px);left:25px;right:25px;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#777;font-weight:700}.sub strong{color:#222}.deck{position:absolute;top:50%;left:50%;width:280px;height:min(500px,59dvh);min-height:340px;transform:translate(-50%,-45%);touch-action:pan-y}.back{position:absolute;inset:0;border-radius:33px;background:#d4d4d2;border:1px solid #fff;box-shadow:0 18px 40px #0001}.back.a{transform:translate(-21px,13px) rotate(-6deg)}.back.b{transform:translate(21px,13px) rotate(6deg)}.card{position:absolute;inset:0;border-radius:32px;overflow:hidden;background:#ddd;box-shadow:0 20px 50px #0002;touch-action:pan-y;cursor:grab;user-select:none;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .3s}.card:active{cursor:grabbing}.card img{width:100%;height:100%;object-fit:cover;display:block}.shade{position:absolute;inset:25% 0 0;background:linear-gradient(transparent 10%,#0002 40%,#000d 100%)}.cardtop{position:absolute;top:17px;left:17px;right:17px;display:flex;justify-content:space-between;align-items:center}.distance{border-radius:99px;padding:8px 11px;background:#ffffffed;color:#111;font-size:10px;font-weight:800}.available{background:#dff6e7;color:#126637;border-radius:99px;padding:8px 10px;font-size:9px;font-weight:800}.cardtext{position:absolute;bottom:22px;left:20px;right:20px;color:white}.name{font-size:36px;line-height:1;font-weight:900;letter-spacing:-1.6px;margin-bottom:9px}.quote{font-size:12px;line-height:1.55;font-weight:600;margin:0 0 13px;max-width:245px}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid #ffffff8a;background:#ffffff2b;backdrop-filter:blur(10px);border-radius:99px;padding:7px 9px;font-size:9px;font-weight:800}.pay{background:#fff;color:#111}.controls{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 25px);left:0;right:0;display:flex;align-items:center;justify-content:center;gap:16px}.circle{border-radius:50%;width:57px;height:57px;background:white;border:1px solid #e5e5e5;font-size:23px;box-shadow:0 7px 20px #0000000b}.primary{border:0;background:var(--red);color:white;border-radius:99px;padding:18px 25px;font-size:12px;font-weight:800;box-shadow:0 10px 25px #d52a3633}.count{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 96px);left:0;right:0;text-align:center;color:#999;font-size:10px;font-weight:700}.sheet{position:absolute;inset:0;background:#0009;z-index:40;display:none;align-items:flex-end}.sheet.open{display:flex}.panel{background:#fff;width:100%;border-radius:30px 30px 0 0;padding:10px 24px calc(env(safe-area-inset-bottom) + 26px);max-height:90%;overflow:auto;animation:rise .3s ease}.handle{height:5px;width:42px;background:#ddd;border-radius:10px;margin:0 auto 18px}.panel h2{font-size:30px;margin:0 0 5px;letter-spacing:-1.2px}.panel .muted{font-size:12px;color:#777;line-height:1.5}.panel p{font-size:13px;line-height:1.7}.panel .row{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.tag{border-radius:99px;background:#f1f1ef;padding:10px 12px;font-size:11px;font-weight:700}.panel .primary{width:100%;margin-top:12px}.close{float:right;border:0;background:#eee;border-radius:50%;width:35px;height:35px;font-size:20px}.filter{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.filter button{border:1px solid #ddd;background:white;padding:10px 12px;border-radius:99px;font-size:11px;font-weight:700}.filter button.active{background:#111;color:#fff}.notice{position:absolute;z-index:60;bottom:115px;left:25px;right:25px;background:#111;color:white;padding:14px;border-radius:15px;text-align:center;font-size:12px;display:none}.notice.show{display:block}@keyframes rise{from{transform:translateY(40px);opacity:.7}to{transform:translateY(0);opacity:1}}@media(max-height:680px){.deck{height:52dvh;transform:translate(-50%,-41%)}.controls{bottom:calc(env(safe-area-inset-bottom) + 13px)}.count{bottom:calc(env(safe-area-inset-bottom) + 80px)}}@media(max-width:360px){.deck{width:250px}.name{font-size:32px}}
</style></head><body><main class="app"><header class="top"><div class="logo">alca<span>.</span></div><button id="filterBtn" aria-label="Filtres">☷</button></header><div class="sub"><span>LES GENS FONT LA VILLE.</span><strong id="place">LA ROCHELLE</strong></div><div class="deck"><div class="back a"></div><div class="back b"></div><article class="card" id="card" tabindex="0" aria-label="Profil du guide"></article></div><div class="count" id="count"></div><div class="controls"><button class="circle" id="prev" aria-label="Profil précédent">←</button><button class="primary" id="details">Faire connaissance</button><button class="circle" id="next" aria-label="Profil suivant">→</button></div><div class="sheet" id="sheet"><div class="panel" id="panel"></div></div><div class="notice" id="notice"></div></main><script>
const profiles=[
{name:"Camille",age:34,gender:"women",pic:44,dist:"350 m",formats:["Anecdote","Balade"],pay:"Bénévole",now:true,quote:"Les petites histoires du vieux port, celles qu'on ne lit pas sur les plaques.",bio:"Habitante du centre historique, j'aime raconter l'histoire des rues, des tours et des passages discrets. Une promenade tranquille, à votre rythme.",theme:"Patrimoine et petites histoires",duration:"10 à 45 min"},
{name:"Thomas",age:41,gender:"men",pic:32,dist:"600 m",formats:["Immersion","Balade"],pay:"Tarif fixé",price:"18 € / personne",now:false,quote:"Je vous montre La Rochelle à travers ses photographies d'hier.",bio:"Passionné de photographie ancienne et d'architecture, je propose un parcours qui relie images d'archives et ville actuelle.",theme:"Photographie et architecture",duration:"1 à 2 h"},
{name:"Nadia",age:29,gender:"women",pic:68,dist:"220 m",formats:["Anecdote"],pay:"Bénévole",now:true,quote:"Passez à la boutique : j'ai deux ou trois secrets à partager.",bio:"Commerçante près du marché central, je peux vous donner des conseils, une anecdote locale ou une adresse peu connue lorsque je suis disponible.",theme:"Marché et bonnes adresses",duration:"5 à 15 min"},
{name:"Hugo",age:53,gender:"men",pic:67,dist:"1,1 km",formats:["Immersion"],pay:"Participation libre",now:false,quote:"Des histoires de marins, de tempêtes et de ports.",bio:"Je suis passionné par l'histoire maritime. On prend le temps de marcher, de regarder et de discuter.",theme:"Histoire maritime",duration:"1 h 30 à 3 h"},
{name:"Léa",age:26,gender:"women",pic:22,dist:"850 m",formats:["Balade","Anecdote"],pay:"Bénévole",now:true,quote:"Street art, fresques et recoins que les touristes ratent.",bio:"J'adore les créations urbaines et les nouveaux lieux culturels. Mes balades changent avec les découvertes.",theme:"Art urbain",duration:"15 à 60 min"},
{name:"Marc",age:62,gender:"men",pic:12,dist:"1,8 km",formats:["Anecdote","Immersion"],pay:"Participation libre",now:false,quote:"La ville vue par un ancien marin.",bio:"Je partage volontiers des souvenirs et des récits du littoral, pour une rencontre rapide ou une vraie sortie.",theme:"Vie locale et océan",duration:"10 min à 2 h"},
{name:"Inès",age:31,gender:"women",pic:47,dist:"450 m",formats:["Balade"],pay:"Tarif fixé",price:"12 € / personne",now:false,quote:"On découvre la ville en goûtant ce qui la fait vivre.",bio:"Passionnée de cuisine locale, je propose une balade gourmande entre boutiques et bonnes adresses. Consommations non incluses.",theme:"Saveurs locales",duration:"45 à 75 min"},
{name:"Antoine",age:38,gender:"men",pic:22,dist:"2,2 km",formats:["Immersion","Balade"],pay:"Bénévole",now:false,quote:"Prenons le temps de découvrir les sentiers du littoral.",bio:"Amateur de marche, je partage mes chemins favoris et les points de vue sur les environs.",theme:"Nature et littoral",duration:"1 à 3 h"},
{name:"Sofia",age:45,gender:"women",pic:53,dist:"120 m",formats:["Anecdote"],pay:"Bénévole",now:true,quote:"Une question sur le quartier ? Je suis juste à côté.",bio:"Je tiens un petit commerce et je peux renseigner les voyageurs sur les lieux du quartier pendant mes moments calmes.",theme:"Conseils de quartier",duration:"5 à 10 min"},
{name:"Julien",age:24,gender:"men",pic:75,dist:"950 m",formats:["Balade","Immersion"],pay:"Participation libre",now:false,quote:"Une autre façon de voir la ville, au fil de ses musiques.",bio:"Musicien amateur, je raconte les lieux de concert et les histoires musicales de La Rochelle.",theme:"Musique et culture",duration:"45 min à 2 h"}
];
let filter="Tous",idx=0,active=[],drag=null;const card=document.getElementById("card"),sheet=document.getElementById("sheet"),panel=document.getElementById("panel");function pool(){return profiles.filter(p=>filter==="Tous"||p.formats.includes(filter)||filter===p.pay||filter==="Disponible"&&p.now)}function render(){active=pool();if(!active.length){card.innerHTML='<div style="padding:30px">Aucun profil pour ce filtre.</div>';document.getElementById("count").textContent="0 profil";return}idx=(idx+active.length)%active.length;let p=active[idx];card.style.transition="none";card.style.transform="";card.style.opacity="1";card.innerHTML='<img draggable="false" src="https://randomuser.me/api/portraits/'+p.gender+'/'+p.pic+'.jpg" alt="Portrait fictif de '+p.name+'"><div class="shade"></div><div class="cardtop"><span class="distance">⌖ '+p.dist+'</span>'+(p.now?'<span class="available">● Disponible</span>':'')+'</div><div class="cardtext"><div class="name">'+p.name+'</div><p class="quote">“'+p.quote+'”</p><div class="chips">'+p.formats.map(x=>'<span class="chip">'+x+'</span>').join('')+'<span class="chip pay">'+p.pay+'</span></div></div>';document.getElementById("count").textContent=(idx+1)+' / '+active.length+' profils · glissez pour découvrir';}
function move(dir){if(active.length<2)return;card.style.transition="transform .25s ease,opacity .25s";card.style.transform='translateX('+(dir*390)+'px) rotate('+(dir*12)+'deg)';card.style.opacity="0";setTimeout(()=>{idx=(idx+dir+active.length)%active.length;render();card.style.transform='translateX('+(-dir*65)+'px)';requestAnimationFrame(()=>requestAnimationFrame(()=>{card.style.transition="transform .35s ease,opacity .35s";card.style.transform="";card.style.opacity="1"}))},245)}
function show(content){panel.innerHTML='<div class="handle"></div><button class="close" id="close">×</button>'+content;sheet.classList.add("open");document.getElementById("close").onclick=()=>sheet.classList.remove("open")}
function profile(){let p=active[idx];if(!p)return;show('<h2>'+p.name+', '+p.age+' ans</h2><div class="muted">⌖ '+p.dist+' · '+p.theme+'</div><div class="row">'+p.formats.map(f=>'<span class="tag">'+f+'</span>').join('')+'<span class="tag">'+p.pay+'</span></div><p>'+p.bio+'</p><p><strong>Durée :</strong> '+p.duration+'<br><strong>Participation :</strong> '+(p.price||p.pay)+(p.now?'<br><strong>Disponibilité :</strong> maintenant':'<br><strong>Disponibilité :</strong> sur demande')+'</p><button class="primary" id="contact">Proposer une rencontre</button><p class="muted">Démonstration : aucun message réel n’est envoyé.</p>');document.getElementById("contact").onclick=()=>{sheet.classList.remove("open");toast("Demande simulée pour "+p.name+" ✓")}}
function filters(){show('<h2>Découvrir autrement</h2><p class="muted">Choisissez un format ou une modalité de participation.</p><div class="filter">'+["Tous","Anecdote","Balade","Immersion","Disponible","Bénévole","Participation libre","Tarif fixé"].map(f=>'<button data-filter="'+f+'" class="'+(filter===f?'active':'')+'">'+f+'</button>').join('')+'</div><p class="muted">Profils et disponibilités fictifs pour la démonstration.</p>');panel.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;idx=0;sheet.classList.remove("open");render()})}
function toast(t){let n=document.getElementById("notice");n.textContent=t;n.classList.add("show");setTimeout(()=>n.classList.remove("show"),2200)}
document.getElementById("prev").onclick=()=>move(-1);document.getElementById("next").onclick=()=>move(1);document.getElementById("details").onclick=profile;document.getElementById("filterBtn").onclick=filters;sheet.onclick=e=>{if(e.target===sheet)sheet.classList.remove("open")};card.onclick=()=>{if(!drag)profile()};card.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY,dx:0};card.setPointerCapture(e.pointerId)});card.addEventListener("pointermove",e=>{if(!drag)return;drag.dx=e.clientX-drag.x;if(Math.abs(drag.dx)>7){card.style.transition="none";card.style.transform='translateX('+drag.dx+'px) rotate('+(drag.dx/24)+'deg)'}});card.addEventListener("pointerup",()=>{if(!drag)return;let dx=drag.dx;drag=null;if(Math.abs(dx)>65)move(dx<0?1:-1);else{card.style.transition="transform .3s";card.style.transform=""}});card.addEventListener("pointercancel",()=>{drag=null;card.style.transform=""});document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")move(1);if(e.key==="ArrowLeft")move(-1);if(e.key==="Escape")sheet.classList.remove("open")});render();
</script></body></html>
